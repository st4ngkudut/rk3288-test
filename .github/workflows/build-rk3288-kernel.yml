name: Build RK3288 Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Armbian kernel branch"
        required: true
        type: choice
        default: current
        options:
          - current
          - edge

      builder_name:
        description: "Builder name"
        required: true
        type: string
        default: ST4NGKUDUT

env:
  TZ: Asia/Jakarta
  BOARD: tinkerboard
  ARMBIAN_REPO: https://github.com/paolosabatino/armbian-build.git

jobs:
  build:
    name: Build RK3288 Kernel
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # FREE DISK
      # ============================================================

      - name: Free disk space
        run: |
          echo "=== Disk before cleanup ==="
          df -h

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache

          echo "=== Disk after cleanup ==="
          df -h


      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            rsync \
            unzip \
            xz-utils \
            gzip \
            bzip2 \
            tar \
            bc \
            bison \
            flex \
            build-essential \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            device-tree-compiler \
            u-boot-tools \
            libncurses-dev \
            libssl-dev \
            libelf-dev \
            python3 \
            python3-dev \
            python3-pip \
            python3-setuptools \
            python3-pyelftools \
            swig \
            ccache \
            fakeroot \
            debootstrap \
            qemu-user-static


      # ============================================================
      # CLONE ARMBIAN
      # ============================================================

      - name: Clone Armbian build framework
        run: |
          git clone \
            --depth=1 \
            "${ARMBIAN_REPO}" \
            armbian-build

          cd armbian-build

          echo "========================================"
          echo " ARMBIAN REPOSITORY"
          echo "========================================"

          git remote -v

          echo
          echo "Commit:"
          git log -1 --oneline


      # ============================================================
      # VERIFY TINKER BOARD
      # ============================================================

      - name: Verify Tinker Board configuration
        run: |
          cd armbian-build

          echo "========================================"
          echo " TINKER BOARD CONFIGURATION"
          echo "========================================"

          test -f config/boards/tinkerboard.conf

          cat config/boards/tinkerboard.conf

          echo
          echo "Checking RK3288..."

          grep -q \
            'BOOTCONFIG="tinker-s-rk3288_defconfig"' \
            config/boards/tinkerboard.conf

          grep -q \
            'BOOT_SOC="rk3288"' \
            config/boards/tinkerboard.conf

          echo
          echo "Tinker Board RK3288 configuration OK."


      # ============================================================
      # SHOW CLI HELP
      # ============================================================

      - name: Check Armbian kernel CLI
        run: |
          cd armbian-build

          echo "========================================"
          echo " ARMBIAN KERNEL CLI"
          echo "========================================"

          ./compile.sh kernel --help || true


      # ============================================================
      # BUILD KERNEL
      # ============================================================

      - name: Build RK3288 kernel
        env:
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
        run: |
          cd armbian-build

          echo "========================================"
          echo " BUILD RK3288 KERNEL"
          echo "========================================"

          echo "BOARD   = ${BOARD}"
          echo "BRANCH  = ${KERNEL_BRANCH}"
          echo "RELEASE = noble"

          ./compile.sh kernel \
            BOARD="${BOARD}" \
            BRANCH="${KERNEL_BRANCH}" \
            RELEASE=noble


      # ============================================================
      # INSPECT OUTPUT
      # ============================================================

      - name: Inspect build output
        if: always()
        run: |
          cd armbian-build

          echo "========================================"
          echo " BUILD OUTPUT"
          echo "========================================"

          if [ -d output ]; then

            echo
            echo "=== ALL OUTPUT FILES ==="

            find output \
              -type f \
              -print \
              | sort

            echo
            echo "=== DEB ==="

            find output \
              -type f \
              -name "*.deb" \
              -print \
              | sort

            echo
            echo "=== KERNEL / DTB ==="

            find output \
              -type f \
              \( \
                -name "zImage" \
                -o -name "Image" \
                -o -name "*.dtb" \
                -o -name "System.map*" \
                -o -name "config-*" \
              \) \
              -print \
              | sort

          else

            echo "output directory does not exist."

          fi


      # ============================================================
      # COLLECT PACKAGES
      # ============================================================

      - name: Collect kernel packages
        if: success()
        run: |
          mkdir -p kernel-artifact/debs

          find armbian-build/output \
            -type f \
            -name "*.deb" \
            -exec cp -v {} kernel-artifact/debs/ \; \
            || true

          echo
          echo "Collected packages:"

          find kernel-artifact/debs \
            -type f \
            -print \
            | sort


      # ============================================================
      # EXTRACT KERNEL IMAGE
      # ============================================================

      - name: Extract kernel packages
        if: success()
        run: |
          mkdir -p kernel-artifact/extracted

          for DEB in kernel-artifact/debs/*.deb; do

            [ -f "$DEB" ] || continue

            echo
            echo "Extracting:"
            echo "$DEB"

            dpkg-deb -x \
              "$DEB" \
              kernel-artifact/extracted

          done


      # ============================================================
      # COLLECT BOOT
      # ============================================================

      - name: Collect boot files
        if: success()
        run: |
          mkdir -p kernel-artifact/boot

          echo "========================================"
          echo " BOOT FILES"
          echo "========================================"

          if [ -d kernel-artifact/extracted/boot ]; then

            find kernel-artifact/extracted/boot \
              -type f \
              -print \
              -exec cp -v {} kernel-artifact/boot/ \;

          fi

          echo
          echo "Collected:"

          find kernel-artifact/boot \
            -type f \
            -print \
            | sort


      # ============================================================
      # COLLECT DTB
      # ============================================================

      - name: Collect RK3288 DTB
        if: success()
        run: |
          mkdir -p kernel-artifact/dtb

          echo "========================================"
          echo " RK3288 DTB"
          echo "========================================"

          find kernel-artifact/extracted \
            -type f \
            -name "*rk3288*.dtb" \
            -print \
            -exec cp -v {} kernel-artifact/dtb/ \; \
            || true

          echo
          echo "Collected DTBs:"

          find kernel-artifact/dtb \
            -type f \
            -print \
            | sort


      # ============================================================
      # COLLECT MODULES
      # ============================================================

      - name: Collect modules
        if: success()
        run: |
          mkdir -p kernel-artifact/modules

          if [ -d kernel-artifact/extracted/lib/modules ]; then

            cp -a \
              kernel-artifact/extracted/lib/modules \
              kernel-artifact/modules/

          fi

          echo "========================================"
          echo " MODULES"
          echo "========================================"

          find kernel-artifact/modules \
            -type f \
            -print \
            | sort \
            | head -200 \
            || true


      # ============================================================
      # KERNEL VERSION
      # ============================================================

      - name: Detect kernel version
        if: success()
        run: |
          mkdir -p kernel-artifact/metadata

          KVER=""

          if [ -d kernel-artifact/modules/modules ]; then

            KVER=$(find \
              kernel-artifact/modules/modules \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
              | head -n1)

          fi

          if [ -z "$KVER" ]; then
            KVER="unknown"
          fi

          echo "$KVER" \
            | tee kernel-artifact/metadata/kernel-version.txt


      # ============================================================
      # METADATA
      # ============================================================

      - name: Save metadata
        if: success()
        run: |
          mkdir -p kernel-artifact/metadata

          echo "RK3288" \
            > kernel-artifact/metadata/soc.txt

          echo "ASUS Tinker Board S" \
            > kernel-artifact/metadata/board.txt

          echo "${{ inputs.kernel_branch }}" \
            > kernel-artifact/metadata/kernel-branch.txt

          echo "${{ inputs.builder_name }}" \
            > kernel-artifact/metadata/builder.txt

          echo "noble" \
            > kernel-artifact/metadata/release.txt

          cd armbian-build

          git rev-parse HEAD \
            > ../kernel-artifact/metadata/armbian-commit.txt

          git log -1 \
            --format='%H%n%ad%n%s' \
            --date=iso \
            > ../kernel-artifact/metadata/build-commit.txt


      # ============================================================
      # FINAL FILE LIST
      # ============================================================

      - name: Show final files
        if: success()
        run: |
          echo
          echo "========================================"
          echo " FINAL KERNEL"
          echo "========================================"

          find kernel-artifact \
            -type f \
            -printf '%p\t%k KB\n' \
            | sort


      # ============================================================
      # SHA256
      # ============================================================

      - name: Create SHA256SUMS
        if: success()
        run: |
          cd kernel-artifact

          find . \
            -type f \
            ! -name "SHA256SUMS" \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > SHA256SUMS

          echo
          cat SHA256SUMS


      # ============================================================
      # ARCHIVE
      # ============================================================

      - name: Create kernel archive
        if: success()
        run: |
          tar -czf \
            OpenWrt-RK3288-TinkerBoardS-kernel.tar.gz \
            -C kernel-artifact \
            .

          sha256sum \
            OpenWrt-RK3288-TinkerBoardS-kernel.tar.gz \
            > OpenWrt-RK3288-TinkerBoardS-kernel.tar.gz.sha256

          ls -lh \
            OpenWrt-RK3288-TinkerBoardS-kernel.tar.gz \
            OpenWrt-RK3288-TinkerBoardS-kernel.tar.gz.sha256


      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload kernel artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RK3288-TinkerBoardS-kernel-${{ inputs.kernel_branch }}
          path: |
            kernel-artifact/
            OpenWrt-RK3288-TinkerBoardS-kernel.tar.gz
            OpenWrt-RK3288-TinkerBoardS-kernel.tar.gz.sha256
          compression-level: 0
          retention-days: 30
